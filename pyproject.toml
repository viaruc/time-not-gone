[project]
name = "time-not-gone"
version = "0.1.0"
description = "Track how much time you spend in each workspace across Claude Code, Claude Desktop and Cowork sessions"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
tng = "time_not_gone.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/time_not_gone"]
